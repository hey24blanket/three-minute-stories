<!doctype html>
<html lang="ko">
<head>

<title>삼분극장 · 이야기 게시판</title>

<body>

    <button class="button quiet top-workspace" data-action="workspace">작업실 연결</button>

<main class="shell">

    <div class="hero-copy">
      <div class="eyebrow"><i></i> 단편 이야기 작업실</div>
      <h1 id="hero-title">세 분 안에,<br>하나의 세계.</h1>

  <nav class="tabs" aria-label="게시판 메뉴">

  <div id="status" class="notice" role="status" hidden></div>
  <div class="layout">
    <section id="main-panel" class="panel"><p class="loading">게시판을 불러오는 중입니다.</p></section>

  <footer><strong>삼분극장</strong><span>한 편의 시작부터 세 번째 버전까지.</span></footer>
